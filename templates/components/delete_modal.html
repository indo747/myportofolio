{% comment %}
Shared delete dialog. Expects modal_id (unique per row), modal_title, delete_url
and optionally modal_subtitle.
{% endcomment %}
<button type="button" class="button button-danger" popovertarget="delete-{{ modal_id }}" aria-label="Delete {{ modal_title }}" title="Delete entry">
    Delete
</button>
<div id="delete-{{ modal_id }}" class="delete-modal" popover="auto" role="dialog" aria-modal="true" aria-labelledby="delete-{{ modal_id }}-title">
    <button type="button" class="delete-modal__backdrop" popovertarget="delete-{{ modal_id }}" popovertargetaction="hide" aria-label="Close delete confirmation"></button>
    <div class="delete-modal__content">
        <button type="button" class="delete-modal__close" popovertarget="delete-{{ modal_id }}" popovertargetaction="hide" aria-label="Close delete confirmation">&times;</button>
        <h2 id="delete-{{ modal_id }}-title">Delete this entry?</h2>
        <p>
            Are you sure you want to delete
            <strong>{{ modal_title }}</strong>{% if modal_subtitle %} at {{ modal_subtitle }}{% endif %}?
        </p>
        <div class="delete-modal__actions">
            <button type="button" class="button button-secondary" popovertarget="delete-{{ modal_id }}" popovertargetaction="hide">Cancel</button>
            <form method="post" action="{{ delete_url }}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Yes, delete</button>
            </form>
        </div>
    </div>
</div>
